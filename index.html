<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chananya</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #faf9f6;
        color: #252723;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4.5rem);
        font-weight: 400;
        line-height: 1.2;
        letter-spacing: -0.04em;
      }
      strong {
        display: block;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hi, my name is <strong>Chananya.</strong></h1>
    </main>
  </body>
</html>
